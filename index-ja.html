const DESC={"可燃ごみ": "燃やすごみ", "不燃ごみ": "燃やさないごみ", "金属（資源再生物）": "金属の資源再生物", "粗大ごみ": "粗大ごみ", "小型家電": "小型家電の回収対象", "古紙類（資源再生物）": "古紙類の資源再生物", "容器包装プラスチック": "容器包装プラスチック", "布類（資源再生物）": "布類の資源再生物", "空き缶類（資源再生物）": "空き缶類の資源再生物", "ビン（資源再生物）": "ビンの資源再生物", "家電リサイクル": "家電リサイクル法の対象品", "有害ごみ": "有害ごみ", "処理困難物": "平塚市では通常収集しない処理困難物", "廃食用油（資源再生物）": "廃食用油の回収対象", "剪定枝": "剪定枝の戸別収集対象", "ペットボトル": "ペットボトルの資源回収", "リサイクル": "リサイクル対象", "産業廃棄物": "産業廃棄物"};
const q=document.getElementById('q'),cat=document.getElementById('cat'),results=document.getElementById('results'),count=document.getElementById('count');
const cats=[...new Set(DATA.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o)});
function norm(s){return String(s).toLowerCase().normalize('NFKC').replace(/[\u0300-\u036f]/g,'').replace(/[\p{P}\p{S}]+/gu,' ').replace(/\s+/g,' ').trim()}
function score(item,query){const a=norm(item.item),b=norm(query),alias=norm(item.alias||'');if(!b)return 0;if(a===b)return 1000;if(a.startsWith(b))return 850;if(a.includes(b))return 700;if(alias===b)return 650;if(alias.includes(b))return 500;const bt=b.split(' ').filter(Boolean),at=a.split(' ');let hits=0;bt.forEach(t=>{if(at.some(x=>x===t))hits+=3;else if(at.some(x=>x.startsWith(t)))hits+=2;else if(at.some(x=>x.includes(t)))hits+=1});return hits?hits*100:0}
function render(){const query=q.value.trim(),filter=cat.value;let arr=DATA.filter(x=>!filter||x.category===filter).map(x=>({...x,s:score(x,query)}));if(query)arr=arr.filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.item.localeCompare(b.item,'ja'));else arr.sort((a,b)=>a.item.localeCompare(b.item,'ja'));const shown=arr.slice(0,80);count.textContent=query?`${arr.length}件`: `${DATA.length}品目`;if(!shown.length){results.innerHTML='<div class="empty"><b>該当する品目が見つかりません。</b><br>「ボールペン」など、より簡単な言葉でも検索してみてください。</div>';return}results.innerHTML=shown.map(x=>{const d=x.disposal||'この品目について、元資料には追加の出し方の記載がありません。';return `<article class="card"><div class="top"><h2 class="item">${esc(x.item)}</h2><span class="badge">${esc(x.category||'未指定')}</span></div><div class="label">何ごみですか？</div><p class="desc">${esc(DESC[x.category]||x.category||'元資料に分別区分の記載がありません。')}</p><div class="label">出し方</div><p class="dispose">${esc(d)}</p><div class="source">元資料：提供されたPDFの${x.page}ページ</div></article>`}).join('')}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
q.addEventListener('input',render);cat.addEventListener('change',render);document.getElementById('clear').addEventListener('click',()=>{q.value='';q.focus();render()});document.querySelectorAll('.tipq').forEach(e=>e.addEventListener('click',()=>{q.value=e.textContent;render();q.focus()}));render();
</script></body></html>
